name: ci
on:
  push:
    branches: [master]
  pull_request:
defaults:
  run:
    working-directory: paratech
jobs:
  hub-and-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./hub/... ./shared/...
      - run: go test ./hub/... ./shared/...
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./desktop/...
      - run: go test ./desktop/...
