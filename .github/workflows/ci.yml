name: ci
on:
  push:
    branches: [master]
  pull_request:
defaults:
  run:
    working-directory: paratech
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: paratech/*/go.sum
      - run: go build ./desktop/... ./hub/... ./shared/...
      - run: go vet ./desktop/... ./hub/... ./shared/...
      - run: go test -race ./desktop/... ./hub/... ./shared/...
      # Windows-only code must compile even when developed on another OS.
      - run: GOOS=windows go vet ./desktop/...
      # The E2E build (ADR-0035) adds its flags only with tag e2e.
      - run: go vet -tags e2e ./desktop/...
      - run: go test -race -tags e2e ./desktop/...
      # The owner's beta (ADR-0036) wires the local Hub only with tag beta.
      - run: go vet -tags beta ./desktop/...
      - run: go test -race -tags beta ./desktop/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./desktop/... ./hub/... ./shared/...
          working-directory: paratech
      # The default run above skips //go:build windows files.
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.14.0
          args: ./desktop/...
          working-directory: paratech
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          input: paratech/shared
          lint: true
          format: true
          breaking: false
          push: false
          pr_comment: false
      # Generated code is committed (ARCH-35): fail when it drifts from the proto files.
      # gen is emptied first because buf generate never deletes files of removed protos.
      - run: |
          find shared/gen -type f -delete
          (cd shared && buf generate)
          test -z "$(git status --porcelain -- shared/gen)"
      # Same for the sqlc output of the SQLite adapter.
      - run: |
          (cd desktop/internal/adapters/sqlite && go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate)
          test -z "$(git status --porcelain -- desktop/internal/adapters/sqlite/sqlcgen)"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: paratech/*/go.sum
      - run: go vet ./desktop/... ./hub/... ./shared/...
      - run: go test ./desktop/... ./hub/... ./shared/...
      - run: go vet -tags e2e ./desktop/...
      - run: go test -tags e2e ./desktop/...
      - run: go vet -tags beta ./desktop/...
      - run: go test -tags beta ./desktop/...
  frontend:
    # Build and test the React UI once desktop/frontend exists (TASK-021); skipped until then.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paratech/desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: test -f paratech/desktop/frontend/package-lock.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paratech/desktop/frontend/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        run: npm ci
      - if: steps.present.outputs.yes == 'true'
        run: npm run build
      - if: steps.present.outputs.yes == 'true'
        run: npm run test
  e2e-static:
    # ADR-0035: the E2E runner is only type-checked and unit-tested here; it needs Windows, WebView2 and Docker to run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paratech/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paratech/e2e/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          PARATECH_E2E_UNIT_ONLY: "1"
      - run: npx tsc --noEmit -p tsconfig.json
  vulncheck:
    # Known vulnerabilities in the Go standard library and dependencies that the code actually calls.
    # Not-applicable findings are listed with a reason in .github/vulncheck-allow.txt (docs/process/security-review.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: paratech/*/go.sum
      - run: python3 ../.github/scripts/vulncheck.py
