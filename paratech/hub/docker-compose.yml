# Local development infrastructure of the Hub. Not a production deployment.
#
#   docker compose -f hub/docker-compose.yml up -d --wait postgres      # database only (run from paratech/)
#   HUB_DATABASE_URL=postgres://hub:hub-dev-only@127.0.0.1:55432/hub?sslmode=disable go run ./hub/cmd/hub
#   HUB_TEST_DATABASE_URL=<same URL> go test -race ./hub/...           # DB tests use their own schema each
#   docker compose -f hub/docker-compose.yml --profile hub up -d --build # also the Hub container, on 127.0.0.1:58080
#   docker compose -f hub/docker-compose.yml down -v                     # stop and delete the data
#
# The password below is a dev-only value for a database reachable from localhost only. Real database passwords, Hub API
# keys and provider credentials are never stored in the repository.
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 512m
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub-dev-only
      POSTGRES_DB: hub
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  hub:
    profiles: ["hub"]
    build:
      context: ..
      dockerfile: hub/Dockerfile
    mem_limit: 256m
    environment:
      HUB_DATABASE_URL: postgres://hub:hub-dev-only@postgres:5432/hub?sslmode=disable
      HUB_LISTEN_ADDR: ":8080"
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
